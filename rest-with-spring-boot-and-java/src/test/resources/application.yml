server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://github.com/caioo105
spring:
  application:
    name: rest_with_spring_boot_and_java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show-sql: false
    open-in-view: false

logging:
  level:
    br.com.caio: DEBUG

springdoc:
  paths-to-match:
    - /api/**/v1/**
  swagger-ui:
    use-root-path: true